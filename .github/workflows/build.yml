name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y \
          build-essential git ffmpeg libsdl2-dev libsdl2-image-dev \
          libsdl2-mixer-dev libsdl2-ttf-dev libportmidi-dev libswscale-dev \
          libavformat-dev libavcodec-dev zlib1g-dev autoconf libtool \
          pkg-config ccache openjdk-17-jdk zip unzip libffi-dev \
          libssl-dev lld clang cmake ninja-build

    - name: Install Build Tools
      run: |
        python -m pip install --upgrade pip setuptools wheel
        pip install "cython<3.0.0" buildozer virtualenv

    - name: Build APK with Buildozer
      env:
        APP_ANDROID_ACCEPT_SDK_LICENSE: "1"
        BUILDOZER_WARN_ON_ROOT: "0"
      run: |
        yes | buildozer -v android debug

    - name: Upload APK Artifact
      uses: actions/upload-artifact@v4
      with:
        name: Zain-APK
        path: bin/*.apk
        
